apiVersion: apps.emqx.io/v2
kind: EMQX
metadata:
  name: emqx
spec:
  image: emqx/emqx:5.10.0
  imagePullPolicy: Always
  config:
    data: |
      license { key = "evaluation" }
  updateStrategy:
    minReadySeconds: 5
    evacuationStrategy:
      waitTakeover: 5 # seconds
      waitHealthCheck: 5 # seconds
