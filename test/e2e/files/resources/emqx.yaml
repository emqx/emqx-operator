apiVersion: apps.emqx.io/v3beta1
kind: EMQX
metadata:
  name: emqx
spec:
  image: emqx/emqx:5.10.0
  imagePullPolicy: Always
  config:
    data: |
      license { key = "evaluation" }
  coreTemplate:
    spec:
      minReadySeconds: 3
  updateStrategy:
    evacuationStrategy:
      waitTakeover: 5 # seconds
      waitHealthCheck: 5 # seconds
