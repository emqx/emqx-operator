apiVersion: apps.emqx.io/v3beta1
kind: EMQX
metadata:
  name: emqx
spec:
  image: emqx/emqx:6.2.1
  imagePullPolicy: IfNotPresent
  config:
    roots:
      license:
        key: evaluation
  coreTemplate:
    spec:
      minReadySeconds: 3
  updateStrategy:
    evacuationStrategy:
      waitTakeover: 5 # seconds
      waitHealthCheck: 5 # seconds
