name: Tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

env:
  TEST_E2E_COVERAGE_PATH: /tmp/kind/data/emqx-operator-system/test-e2e-coverage

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy

      - run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: coverprofile-unit
          path: ${{ github.workspace }}/cover.out
          if-no-files-found: ignore
          retention-days: 1

  test-e2e-labels:
    name: Discover E2E Labels
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - id: labels
        shell: bash
        run: |
          labels=$(go run github.com/onsi/ginkgo/v2/ginkgo labels ./test/e2e |
            jq -Rce 'ltrimstr("e2e: ") | fromjson | map(select(startswith("ci-"))) | unique')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

  test-e2e:
    name: E2E Tests - ${{ matrix.label }}
    needs: test-e2e-labels
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON(needs.test-e2e-labels.outputs.labels) }}
        include:
          - label: smoke
          - label: unlabeled
    runs-on: ubuntu-latest
    env:
      TEST_E2E_DIAGNOSTIC_REPORT_PATH: ${{ github.workspace }}/test-report
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy

      - run: make "test-e2e-${{ matrix.label }}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-e2e-${{ matrix.label }}
          path: ${{ env.TEST_E2E_DIAGNOSTIC_REPORT_PATH }}
          if-no-files-found: ignore

      - name: Collect test coverage
        run: |
          if [ -d "$TEST_E2E_COVERAGE_PATH" ]; then
            go tool covdata textfmt -i "$TEST_E2E_COVERAGE_PATH" -o "${{ github.workspace }}/cover.e2e.out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverprofile-e2e-${{ matrix.label }}
          path: ${{ github.workspace }}/cover.e2e.out
          if-no-files-found: ignore
          retention-days: 1

  test-stress:
    name: E2E Stress Tests
    strategy:
      fail-fast: true
      matrix:
        include:
          - profile: short
            steps: 5
            interval: 5s
          - profile: long
            steps: 15
            interval: 10s

    runs-on: ubuntu-latest
    env:
      TEST_E2E_DIAGNOSTIC_REPORT_PATH: ${{ github.workspace }}/test-report
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy

      - run: make test-e2e-stress
        env:
          TEST_E2E_STRESS_STEPS: ${{ matrix.steps }}
          TEST_E2E_STRESS_STEP_INTERVAL: ${{ matrix.interval }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-stress-${{ matrix.profile }}
          path: ${{ env.TEST_E2E_DIAGNOSTIC_REPORT_PATH }}
          if-no-files-found: ignore

      - run: go tool covdata textfmt -i "$TEST_E2E_COVERAGE_PATH" -o ${{ github.workspace }}/cover.stress.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverprofile-stress-${{ matrix.profile }}
          path: ${{ github.workspace }}/cover.stress.out
          if-no-files-found: ignore
          retention-days: 1

  test-upgrade:
    name: E2E Upgrade Tests - ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - initial: "emqx/emqx:5.10.2"
            upgrade: "emqx/emqx:6.1.0"
            profile: "5.10.2-6.1.0"
          - initial: "emqx/emqx:6.0.2"
            upgrade: "emqx/emqx:6.1.0"
            profile: "6.0.2-6.1.0"
          - initial: "emqx/emqx:6.2.2"
            upgrade: "emqx/emqx:6.3.0"
            profile: "6.2.2-6.3.0"

    runs-on: ubuntu-latest
    env:
      TEST_E2E_DIAGNOSTIC_REPORT_PATH: ${{ github.workspace }}/test-report
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: false

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy

      - run: make test-e2e-upgrade
        env:
          TEST_E2E_UPGRADE_IMAGE_INITIAL: ${{ matrix.initial }}
          TEST_E2E_UPGRADE_IMAGE_UPGRADE: ${{ matrix.upgrade }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-upgrade-${{ matrix.profile }}
          path: ${{ env.TEST_E2E_DIAGNOSTIC_REPORT_PATH }}
          if-no-files-found: ignore

      - run: go tool covdata textfmt -i "$TEST_E2E_COVERAGE_PATH" -o ${{ github.workspace }}/cover.upgrade.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverprofile-upgrade-${{ matrix.profile }}
          path: ${{ github.workspace }}/cover.upgrade.out
          if-no-files-found: ignore
          retention-days: 1

  test-e2e-helm:
    name: E2E Helm Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - run: go mod tidy

      - run: make test-e2e-helm

  codecov:
    runs-on: ubuntu-latest
    needs: [test, test-e2e, test-upgrade]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverprofile-*
          path: /tmp/coverprofile
      - name: Get cover files
        id: files
        run: |
          files="$(find /tmp/coverprofile -type f -exec readlink -f '{}' ';' | tr '\n' ',' | sed 's/,$//g')"
          echo "files=$files" | tee -a $GITHUB_OUTPUT
      - uses: codecov/codecov-action@v4
        with:
          files: ${{ steps.files.outputs.files }} # optional
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: coverprofile-*
