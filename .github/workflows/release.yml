name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (e.g., main)'
        required: true
        default: main-2.3
      tag:
        description: 'Release tag (e.g., 2.3.0). If empty, dry run.'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/emqx-operator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch) || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.RELEASE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false

      - name: Build installer
        run: |
          make build-installer OPERATOR_IMAGE=${{ env.RELEASE_IMAGE }}:${{ env.RELEASE_VERSION || format('{0}-{1}', github.ref_name, github.sha) }}

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            dist/install.yaml \
            --title "EMQX Operator ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag \
            --draft

  helm:
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch) || github.ref }}

      - uses: azure/setup-helm@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Vet Chart
        run: |
          app_version=$(yq '.appVersion' deploy/charts/emqx-operator/Chart.yaml)
          if [ "$app_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Chart appVersion ($app_version) does not match release tag ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Generate CRDs
        run: make build-crd

      - name: Helm lint
        run: helm lint deploy/charts/emqx-operator

      - name: Helm template dry-run
        run: helm template emqx-operator deploy/charts/emqx-operator | kubectl apply --dry-run=client -f -

      - name: Push Helm Chart
        if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        uses: emqx/push-helm-action@v1.1
        with:
          charts_dir: "${{ github.workspace }}/deploy/charts/emqx-operator"
          version: ${{ env.RELEASE_VERSION }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: "us-west-2"
          aws_bucket_name: "repos-emqx-io"
